name: Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: PHP dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        working-directory: src
        run: composer audit --no-interaction

      - name: Pint(check)
        working-directory: src
        run: vendor/bin/pint --test

      - name: PHPStan
        working-directory: src
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        working-directory: src
        env:
          APP_ENV: testing
          CACHE_STORE: redis
          REDIS_CLIENT: phpredis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: cp .env.example .env && php artisan key:generate && php artisan test

      - name: Frontend dependencies
        working-directory: src
        run: npm ci

      - name: NPM audit
        working-directory: src
        run: npm run audit

      - name: Build frontend
        working-directory: src
        run: npm run build

  build-images:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Frontend dependencies
        working-directory: src
        run: npm ci

      - name: Build frontend
        working-directory: src
        run: npm run build

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push image (app)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          TAG=$GITHUB_SHA
          docker buildx build \
            --pull \
            --target prod \
            -f docker/php/Dockerfile \
            -t "$IMAGE:$TAG" \
            --push \
            .

      - name: Build & Push image (web)
        env:
          IMAGE_WEB: ghcr.io/${{ github.repository }}-web
        run: |
          TAG=$GITHUB_SHA
          docker buildx build \
            --pull \
            -f docker/caddy/Dockerfile \
            -t "$IMAGE_WEB:$TAG" \
            --push \
            .
