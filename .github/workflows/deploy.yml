name: Deploy

on:
  push:
    branches: [ "main" ]
  # workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      
      - name: PHP dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist

      - name: Pint(check)
        working-directory: src
        run: vendor/bin/pint --test

      - name: PHPStan
        working-directory: src
        run: vendor/bin/phpstan analyse --no-progress
      
      - name: PHPUnit
        working-directory: src
        env:
          APP_ENV: testing
        run: cp .env.example .env && php artisan key:generate && php artisan test
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Frontend dependencies
        working-directory: src
        run: npm ci

      - name: Typecheck
        working-directory: src
        run: npm run typecheck

      - name: Set image tags
        id: vars
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push image (app)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          TAG=${GITHUB_SHA::7}
          docker buildx build \
            --target prod \
            -f docker/php/Dockerfile \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            --push \
            .

      - name: Build & Push image (web)
        env:
          IMAGE_WEB: ghcr.io/${{ github.repository }}-web
        run: |
          TAG=${GITHUB_SHA::7}
          docker buildx build \
            -f docker/caddy/Dockerfile \
            -t "$IMAGE_WEB:$TAG" \
            -t "$IMAGE_WEB:latest" \
            --push \
            .

      - name: Remote clone/pull & compose up
        uses: appleboy/ssh-action@v1.2.0
        # if: github.event_name == 'workflow_dispatch'
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            REPO="${{ github.repository }}"
            DEST=/srv/spa-exam
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            if [ ! -d "$DEST/.git" ]; then
              git clone --depth=1 "git@github.com:${REPO}.git" "$DEST"
            else
              git -C "$DEST" fetch --prune
              git -C "$DEST" checkout main
              git -C "$DEST" reset --hard origin/main
            fi
            [ -n "$GHCR_USER" ] || { echo "GHCR_USER is empty" >&2; exit 1; }
            [ -n "$GHCR_PAT" ] || { echo "GHCR_PAT is empty" >&2; exit 1; }
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            COMPOSE="$DEST/docker-compose.yml"
            [ -f "$COMPOSE" ] || { echo "compose file not found: $COMPOSE"; ls -la "$DEST"; exit 1; }
            docker compose -f "$COMPOSE" exec -T app php artisan down --render="errors::503" || true
            docker compose -f "$COMPOSE" pull
            docker compose -f "$COMPOSE" up -d --remove-orphans

            # MySQLの起動を待つ
            until docker compose -f "$COMPOSE" exec -T db mysqladmin ping -h "127.0.0.1" --silent; do
              echo "Waiting for MySQL to be ready..."
              sleep 5
            done

            docker compose -f "$COMPOSE" exec -T app php artisan migrate --force
            docker image prune -f
