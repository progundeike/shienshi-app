name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/spa-exam-app" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push via Compose (Buildx Bake)
        run: |
          docker buildx bake \
            -f docker-compose.yml \
            --set app.build.target=prod \
            --set app.tags="${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG }}" \
            --set app.tags+=("${{ step.vars.outputs.IMAGE }}:latest") \
            --push

      - name: Prepare SSH
        run: |
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          fi

      - name: Remote Compose pull & up
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd /srv/spa-exam && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f'
