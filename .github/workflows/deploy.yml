name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Release SHA"
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "完全な40文字のGit SHAを指定してください" >&2
            exit 1
          fi

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Verify release images
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$RELEASE_SHA"
          docker buildx imagetools inspect "${IMAGE}-web:$RELEASE_SHA"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    concurrency: production-deploy

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USER,GHCR_PAT,RELEASE_SHA
          script: |
            set -euo pipefail
            cd /srv/spa-exam

            git fetch --prune origin
            git rev-parse --verify "${RELEASE_SHA}^{commit}"
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
            git checkout --detach --force "$RELEASE_SHA"

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose config --quiet
            docker compose pull app web
            docker compose run --rm --no-deps app php artisan migrate --force
            docker compose up -d --no-deps app
            docker compose up -d --no-deps web
