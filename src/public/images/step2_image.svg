    <path d="M132 186H256"/>
    <path d="M132 228H405"/>
    <path d="M132 270H330"/>
    <path d="M132 312H415"/>
  </g>

  <g stroke="#C9D2DE" stroke-width="7" stroke-linecap="round">
    <path d="M132 123H384"/>
    <path d="M132 165H312"/>
    <path d="M132 207H350"/>
    <path d="M132 249H292"/>
    <path d="M132 291H368"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M450 88H592C610 88 624 102 624 120V205C624 223 610 237 592 237H513L482 268C477 273 468 269 468 262V237H450C432 237 418 223 418 205V120C418 102 432 88 450 88Z" fill="url(#bubbleFill)" stroke="#183768" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <g stroke="#4F6F9B" stroke-width="10" stroke-linecap="round">
    <path d="M468 133H572"/>
    <path d="M468 164H583"/>
    <path d="M468 195H548"/>
