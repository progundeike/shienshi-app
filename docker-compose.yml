services:
  app:
    image: ghcr.io/${owner}/${repo}:latest
    volumes:
      - ./src/.env:/var/www/html/.env:ro
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Tokyo
    depends_on:
      - db
      - redis

  web:
    image: ghcr.io/${owner}/${repo}-web:latest
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  db:
    image: mysql:8.4
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - db-volumes:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/z-my.cnf:ro
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USER}
      - TZ=Asia/Tokyo

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-volumes:/data

volumes:
  db-volumes:
  redis-volumes:
  caddy-data:
  caddy-config:
