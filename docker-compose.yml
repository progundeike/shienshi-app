version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    volumes:
      - ./src:/var/www/html
    ports:
      - 5173:5173
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Tokyo
    depends_on:
      - db

  web:
    image: caddy:2
    ports:
      - 80:80
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src:/var/www/html:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    ports:
      - 3306:3306
    volumes:
      - db-volumes:/var/lib/mysql
      - ./docker/mysql/my.cnf:etc/mysql/conf.d/my.cnf:ro
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USER}
      - TZ=Asia/Tokyo

volumes:
  db-volumes:
